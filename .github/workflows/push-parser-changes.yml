name: Deploy Parser (Google Apps Script)

on:
  push:
    branches:
      - main
    paths:
      - 'parser/**'
  workflow_dispatch:

jobs:
  deploy-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create .clasp.json
        run: |
          printf '%s' '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":""}' > parser/.clasp.json

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.GAS_CLASPRC_JSON }}
        run: |
          mkdir -p ~/.clasp
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push code to Apps Script
        working-directory: parser
        run: clasp push -f

      - name: Deploy new version
        working-directory: parser
        run: clasp deploy --description "Deploy ${{ github.sha }}" -i ${{ secrets.DEPLOY_ID }}